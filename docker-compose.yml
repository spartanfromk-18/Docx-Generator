# SpecForge — production-shaped local stack.
# db      : PostgreSQL 16 with pgvector (required by scripts/init_db.sql)
# server  : Fastify API + pipeline workers (applies the schema on first boot)
# web     : React SPA served by vite preview
#
#   docker compose up --build -d
#   web    -> http://localhost:5173
#   api    -> http://localhost:8787/v1/health/deep
name: specforge

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge_pwd
      POSTGRES_DB: specforge
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specforge -d specforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      USE_MEMORY_DB: "false"
      DATABASE_URL: postgresql://specforge:specforge_pwd@db:5432/specforge
      DB_ROLE_PASSWORD_API: app_api_dev
      DB_ROLE_PASSWORD_SYSTEM: app_system_dev
      JWT_SECRET: dev-only-change-me
      LLM_PROVIDER_ORDER: mock
      SPECFORGE_MOCK_SPEED: "1"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8787
    depends_on:
      - server
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  db_data:
